fragment NavigationFields {
  ... on Navigation {
    sys {
      id
    }
    name
    location

    itemsCollection(limit: 20) {
      items {
        sys {
          id
        }
        __typename

        ... on NavigationItem {
          name
          destinationType
          path
          sectionId
          openInNewTab
          isVisible
        }
      }
    }
  }
}
query SiteSettings {
  siteSettingsCollection(limit: 1) {
    items {
      sys {
        id
      }
      siteName

      primaryNavigation {
        __typename 
        ...NavigationFields
      }

      footerLinksCollection(limit: 10) { 
        items {
          __typename
          ...LinkFields
        }
      }
      
      copyrightText
      location
    }
  }
}
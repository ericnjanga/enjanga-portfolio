query HomePage($slug: String!) {
  homePageCollection(where: { slug: $slug },limit: 1) {
    items {
      ...PageIntros

      hero {
        __typename 
        ...HeroFields
      }

      expertiseSection {
        __typename 
        ...ExpertiseItemFields
      }

      aboutSection {
        __typename 
        ...ContentSectionFields
      }
    }
  }
}